<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Silent-Callback</title>
  <script src="/assets/js/oidc-client.min.js"></script>
</head>
<body>
<script>
  Oidc.Log.logger = console;
  Oidc.Log.level = Oidc.Log.DEBUG;

  const raw = localStorage.getItem('SSO_DATA');
  const sso = raw ? JSON.parse(raw) : {};
  const origin = window.location.origin;

  const settings = {
    authority: sso.Authority || 'https://sso.newtecons.vn/realms/Newtecons',
    client_id: sso.ClientId,
    redirect_uri: sso.UrlApp || (origin + '/assets/refresh.html'),
    response_type: 'code',
    scope: sso.Scope || 'openid profile email',
    automaticSilentRenew: true,
    silent_redirect_uri: origin + '/assets/refresh.html'
  };

  new Oidc.UserManager(settings).signinSilentCallback()
    .catch(err => {
      console.error('Silent renew error:', err);
      document.body.innerText = 'Silent renew error: ' + (err && (err.message || err));
    });
</script>
</body>
</html>
