        <title>Silent-Callback</title>
        <script src="/assets/js/oidc-client.min.js"></script>
    </head>
    <body>
        <script>
            const idpSettings = {

                client_id: "5ebb890b-a43d-4643-ad7f-6dd42d287ed1",
                scope: "openid profile",
                response_type: "code"
            };

            new Oidc.UserManager(idpSettings).signinSilentCallback()

                    console.log(error);
                });
        </script>
    </body>
