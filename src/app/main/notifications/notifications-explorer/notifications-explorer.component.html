<div *ngIf="isUsingFilter" class="col-md-2 filter">
    <section class="content">
        <div class="box" id="box-content">
            <div class="box-header with-border">
                <h3 class="box-title">Điều kiện lọc</h3>
                <div class="box-tools pull-right">
                    <!--button type="button" class="btn btn-box-tool">
                        <i class="fa fa-list" aria-hidden="true"></i>
                    </button-->

                    <a class="dropdown-toggle btn" data-toggle="dropdown" href="#">
                        <i class="fa fa-list" aria-hidden="true"></i>
                    </a>
                    <ul class="dropdown-menu">
                        <li *ngFor="let item of filterData">
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox" (click)="updateCheckedOptions($event, item)" [ngModel]="item.isChecked" />
                                    {{item.label}}
                                </label>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
            <form (ngSubmit)="onSubmit(form)" [formGroup]="form">
                <div class="box-body" [style.height.px]="contentFilterHeight">

                    <div *ngFor="let input of inputs" class="form-row">
                        <df-input [input]="input" [form]="form" (toogle)="tooglePin($event)"></df-input>
                    </div>

                    <!--<div class="form-group">
                        <label>Từ ngày</label>
                        <wj-input-date [(value)]="DocDate1" [format]="'dd/MM/yyyy'"></wj-input-date>
                    </div>
                    <div class="form-group">
                        <label>Đến ngày</label>
                        <wj-input-date [(value)]="DocDate2" [format]="'dd/MM/yyyy'"></wj-input-date>
                    </div>-->
                    <div class="box-footer">
                        <button class="btn btn-primary">Tìm kiếm</button>
                        <button (click)="toogleFilter()" class="btn btn-danger">Hủy</button>
                    </div>
                </div>


            </form>
        </div>
    </section>
</div>
<div [ngClass]="{'col-md-10 content-filter': isUsingFilter}">
    <section class="content nt-inbox">

        <!-- Tiêu đề + thao tác chính -->
        <header class="nt-inbox__head">
            <div class="nt-inbox__heading">
                <span class="nt-inbox__heading-icon" aria-hidden="true"><i class="fa fa-inbox"></i></span>
                <div>
                    <h3 class="nt-inbox__title" id="titleName">Hồ sơ cần xử lý</h3>
                </div>
            </div>
            <!-- Thẻ thống kê = lọc nhanh theo trạng thái -->
            <div class="nt-kpis" role="group" aria-label="Lọc nhanh theo trạng thái">
                <button type="button" *ngFor="let k of kpis" class="nt-kpi" [ngClass]="'nt-kpi--' + k.key"
                    [class.is-active]="statusFilter === k.key" [attr.aria-pressed]="statusFilter === k.key"
                    (click)="setStatusFilter(k.key)">
                    <span class="nt-kpi__icon" aria-hidden="true"><i class="fa" [ngClass]="k.icon"></i></span>
                    <span class="nt-kpi__body">
                        <span class="nt-kpi__value">{{stats[k.key] | number}}</span>
                        <span class="nt-kpi__label">{{k.label}}</span>
                    </span>
                </button>
            </div>

                    <i class="fa fa-thumbs-o-up" aria-hidden="true"></i> Duyệt theo lô

                    <i class="fa fa-refresh" [class.fa-spin]="showLoading" aria-hidden="true"></i> Làm mới
                </button>
            </div> -->
        </header>

        <!-- Lưới hồ sơ -->
        <div class="nt-card" #contentFilter>
            <!-- <div class="nt-card__toolbar">

                    <input type="text" class="nt-search__input" autocomplete="off"

                    </button>
                </div>
            </div> -->

            <div class="nt-grid-wrap">
                <wj-flex-grid [itemsSource]="data" #grid (itemsSourceChanged)="itemsSourceChangedHandler()" class="nt-grid">
                    <wj-flex-grid-filter #filter></wj-flex-grid-filter>
                </wj-flex-grid>

                <div class="nt-empty" *ngIf="!showLoading && visibleCount === 0">
                    <i class="fa fa-check-circle-o nt-empty__icon" aria-hidden="true"></i>
                    <div class="nt-empty__title" *ngIf="stats.all === 0">Không có hồ sơ nào cần xử lý</div>
                    <div class="nt-empty__title" *ngIf="stats.all > 0">Không có hồ sơ phù hợp bộ lọc</div>
                    <button type="button" class="nt-btn" *ngIf="stats.all > 0" (click)="clearQuickFilter()">Bỏ lọc nhanh</button>

            </div>
        </div>
    </section>
</div>

<div style="clear:both;"></div>

<!--Loading-->
<div *ngIf="showLoading" class="bravo-wait">
    <img src="/assets/img/gears.svg" style="width:50%">
    <div style="font-size: 15px; padding-left: 12px;color: #fff;">Loading ....</div>
</div>

<div *ngIf="showLoading" class="bravo-wrapper" style="height: 100%; width: 100%;"></div>
