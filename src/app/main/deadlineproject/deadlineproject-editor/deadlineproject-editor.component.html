<!-- Main content -->
<section class="content">
  <!-- Default box -->
  <form (ngSubmit)="onSubmit(editorFrm)" [formGroup]="editorFrm" (keydown)="handleKeyDown($event)">
    <div class="box" id="box-content">
      <div class="box-header with-border">
        <h3 class="box-title" id="titleName">Deadline công việc</h3>
        <div class="box-tools pull-right">
         
          <!-- <button type="button" class="btn btn-box-tool" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                        <i class="fa fa-minus"></i>
                    </button>
                    <button type="button" class="btn btn-box-tool" data-widget="remove" data-toggle="tooltip" title="Remove" style="display:none;">
                        <i class="fa fa-times"></i>
                    </button> -->
          <!-- <button class="btn btn-primary" type="button" (click)=onClick(editorFrm) [disabled]="!editorFrm.valid" *ngIf="parentData?.ApproveSend == true && parentData?.DocStatus != 4">Duyệt</button> -->
          <!-- <button class="btn btn-danger" type="button" (click)="onSubmit(editorFrm,false,true)" *ngIf="parentData?.CompletedApprove==true">Lưu & Đóng đơn hàng</button>            -->
     
          <!-- <button class="btn btn-primary" type="button" (click)="saveData(editorFrm,1)"
          [disabled]="!editorFrm.valid || parentData?.ApproveSend==true || parentData?.Id < 0"
          *ngIf="isSysAdmin=='true' || isPermisionEdiAll_isApprove">Gửi BCH</button> -->
          <button class="btn btn-warning dropdown-toggle" title="In, kết xuất" type="button" data-toggle="dropdown" [disabled]="parentData?.Id == -1"
            *ngIf="isSysAdmin=='true' || isPermisionEdiAll_isPrint">
            Mẫu in
            <span class="caret"></span>
          </button>
          <ul class="dropdown-menu" style="margin-left: 10%;border-color: antiquewhite;background-color: antiquewhite;width: 150%;">
            <li>
              <a class="dropdown-item" style="height: 39px;" *ngFor="let layout of listLayoutPrint"> {{layout.Name}}
                <!-- <button class="btn " type="button" (click)="exportHtml(layout.WordName,layout.FileName, layout.FolderPath)" 
                  style="color:white;float: right;margin-left:5px;background-color:orange;height: 100%;">
                  <i class="fa fa-file-pdf-o" aria-hidden="true"></i>
                </button> -->
                
                <button class="btn " type="button" (click)="exportExcel(layout.ExcelName,layout.FileName, layout.FolderPath)"
                  style="color:white;float: right;margin-left:5px;background-color:rgba(0, 128, 0, 0.871);height: 100%;">
                  <i class="fa fa-file-excel-o" aria-hidden="true"></i>
                </button>
              </a>
            </li>
          </ul>
        <button class="btn btn-success" type="submit"
          [disabled]="!editorFrm.valid || parentData?.ApproveSend==true || showLoading==true"
          *ngIf="isSysAdmin=='true' || isPermisionEdiAll_isSave">Lưu</button>
        <a class="btn btn-default" [routerLink]="['/main','deadlineproject','index']">Thoát</a>
          <!-- (click)="backClick()" -->
        </div>
      </div>
      <div class="box-body">
        <div *ngIf="editorFrm.errors" class="alert alert-danger"><strong>{{editorFrm.errors['error']}}</strong></div>
        <div *ngFor="let panel of _layoutDeclare.panels" class="form-row" [ngStyle]="setDisplayPanel()">
          <df-panel [panel]="panel" #dfpanel [form]="editorFrm" (valueChanged)="onValueChanged($event)">
          </df-panel>
          <div style="clear:both"></div>
        </div>

        <div style="clear:both"></div>

      </div>
      <!-- /.box-body -->
      <div class="box-footer">

        <button class="btn btn-info fa fa-refresh" type="button" [disabled]="!editorFrm.valid"
          style="margin-bottom:10px;" (click)=confirmDialog()>
          <span style="font-size:11pt;font-family:Arial, Helvetica, sans-serif"> Tải dữ liệu</span>
        </button>

        <button title="Ẩn/ Hiện đầu phiếu" class="btn btn-info fa fa-arrows-v" type="button"
          [disabled]="editorFrm.disabled" style="margin-bottom:10px;" (click)=onclickCollapsablePanel([grid])>
          <span style="font-size:12pt;"></span>
        </button>

        <!-- <div class="bravo-dropdown">
          <button type="button" (click)="openbravoDropdown()" class="bravo-dropbtn btn btn-success fa fa-database"
            style="margin-bottom:10px;">
            <span style="font-size:11pt;font-family:Arial, Helvetica, sans-serif">Lấy dữ liệu</span>
            <span class="caret"></span>
          </button>
          <div id="bravoDropdown" class="bravo-dropdown-content">
            <a class="dropdown-item" style="cursor: pointer;" *ngFor="let linkCommand of listlinkCommandPopup"
              (click)="openLinkCommand(linkCommand)">
              {{linkCommand.Text}}
            </a>
          </div>
        </div> -->

        <!-- <button class="btn btn-success fa fa-file" type="button" style="margin-bottom:10px;"
          (click)="showDocumentInNewTab(parentData?.BizDocId_PO)">
          <span style="font-size:11pt;font-family:Arial, Helvetica, sans-serif"> Xem đơn hàng</span>
        </button> -->

        <div class="form-row" style="border:1px solid #ddd;">
          <div id="cssmenu">
            <ul>
              <li class="active">
                <a href="#tab1" data-toggle="tab" (click)="onTabClick(grid)">Chi tiết công việc</a>
              </li>
              <!-- <li>
                <a href="#tab2" data-toggle="tab" (click)="onTabClick(grid1)">Công nợ chưa tới hạn</a>
              </li>
             
              <li>
                <a href="#tab3" data-toggle="tab" (click)="onTabClick(grid2)">Chưa ký quyết toán</a>
              </li> -->
            </ul>
          </div>
          <div class="tab-content">
            <div class="tab-pane active" id="tab1">
              <section id="new">
                <wj-flex-grid class="grid" #grid style="height:280px;" [ngStyle]="setHeightGrid()">
             
                  <!-- <template wjFlexGridCellTemplate [cellType]="'TopLeft'" let-cell="cell">
                    <button type="button" class="btn" style="margin:auto;width:100%;background-color:aliceblue;"
                      (click)=deleteSelectedRows(grid)>
                      <a class="fa fa-trash-o" style="color:red;"></a>
                    </button>
                  </template> -->
                  <template wjFlexGridCellTemplate [cellType]="'RowHeader'" let-cell="cell">
                    <i class="fa fa-plus-square-o" style="font-size:12pt;color:#53697c" title="Mở form nhập liệu" (click)="showPopup(cell.row,frmPopup)"></i>
                  </template>
                </wj-flex-grid>
              </section>
            </div>
           
           
          </div>
        </div>
      </div>
      <!-- /.box-footer-->
    </div>
  </form>
  <!-- /.box -->
</section>
<!-- /.content -->
<!--Loading-->
<div *ngIf="showLoading" class="bravo-wait">
  <img src="/assets/img/gears.svg" style="width:50%">
  <div style="font-size: 15px; padding-left: 12px;color: #fff;">Loading ....</div>
</div>

<div *ngIf="showLoading" class="bravo-wrapper" style="height: 100%; width: 100%;"></div>
<!--/.Loading-->

<wj-popup class="modal-content" #frmPopup>
 
  <app-deadlineproject-popup-editor-form #popupEditorFrm [popup]="frmPopup"></app-deadlineproject-popup-editor-form>
  
</wj-popup>



<!-- Thêm dialog -->
<app-dialog [(visible)]="showDialog" #dialogFrm>
  <div class="headerConfirm">
    <b style="color: red;">Tải dữ liệu!</b>
  </div>
  <div class="titleConfirm">
    <br />
    <p>
      <b>Thao tác này sẽ thay thế dữ liệu chi tiết đã tồn tại trước đó (nếu có), xác nhận thao tác</b>
    </p>
  </div>
  <div class="btnConfirm">
    <button (click)="onClickNoneValid()" class="btn btn-success">Đồng ý</button>
    <button (click)="closeDialog()" class="btn">Hủy bỏ</button>
  </div>
</app-dialog>
<!-- Hết Thêm dialog -->

<wj-popup #frmPopupTooltip hideTrigger="None" style="width: 40%;height: 400px;">
  <div class="box" style="height: 400px;overflow-y: auto;">
    <div class="box-header with-border"
      style="background:linear-gradient(to right,#2385bd,#a8dac3); position: fixed; width: 40%;">
      <h3 class="box-title" style="color: white;">Ý kiến</h3>
      <div class="box-tools pull-right">
        <button type="button" style="color:red;font-size:18px;" class="btn btn-box-tool"
          (click)="frmPopupTooltip.hide()" data-toggle="tooltip">
          <i class="fa fa-times"></i>
        </button>
      </div>
    </div>
    <div class="box-body" style="margin-top: 35px;">
      <p #contentPopupTooltip></p>
    </div>
  </div>
</wj-popup>

<wj-popup #linkCommandPopup hideTrigger="None" style="width: 60%;">
  <div class="box">
    <div class="box-header with-border">
      <h3 class="box-title">Lấy dữ liệu</h3>
      <!-- <h3 *ngIf="!isLangVN" class="box-title">Choose data</h3> *ngIf="isLangVN" -->
      <div class="box-tools pull-right">
        <button type="button" style="color:blue;font-size:18px;" class="btn btn-box-tool" (click)="sendDataTo()"
          data-toggle="tooltip">
          <i class="fa fa-check-square-o"></i>
        </button>
        <button type="button" style="color:red;font-size:18px;" class="btn btn-box-tool"
          (click)="linkCommandPopup.hide()" data-toggle="tooltip">
          <i class="fa fa-times"></i>
        </button>

      </div>
    </div>
    <div class="box-body">
      <wj-flex-grid class="grid" #linkCommandGrid>
        <ng-template wjFlexGridCellTemplate [cellType]="'RowHeader'" let-row="row" let-cell="cell">
          <input type="checkbox" [checked]="cell.item?.IsTransfer" (change)="checkSelectPopup(row)">
        </ng-template>
      </wj-flex-grid>
    </div>
  </div>
</wj-popup>
