<!-- Main content -->
<section class="content">
  <!-- Default box -->
  <form (ngSubmit)="onSubmit(editorFrm)" [formGroup]="editorFrm" (keydown)="handleKeyDown($event)">
    <div class="box" id="box-content">
      <div class="box-header with-border">
        <h3 class="box-title" id="titleName">Duyệt kế hoạch QLKL - Hoàn thiện</h3>
        <div class="box-tools pull-right">
          <button class="btn btn-success" type="button" (click)=onClick(3)
            *ngIf="parentData?.RequireReturn == 1 && parentData?.CompletedApprove != true"
            [disabled]="!editorFrm.valid || parentData?.EmployeeCodeApprove != ''">Đề xuất trả</button>
          <button class="btn btn-danger" type="button" (click)=onClick(0)
            *ngIf="parentData?.ApproveReturn == 1 && parentData?.CompletedApprove != true"
            [disabled]="!editorFrm.valid || parentData?.EmployeeCodeApprove != ''">Trả lại</button>
          <button class="btn btn-primary" type="button" (click)=onClick(1) *ngIf="parentData?.CompletedApprove != true"
            [disabled]="!editorFrm.valid || parentData?.EmployeeCodeApprove != ''">Duyệt</button>
          <a class="btn btn-default" (click)="backClick()">Thoát</a>
        </div>
      </div>
      <div class="box-body">
        <div *ngIf="editorFrm.errors" class="alert alert-danger">
          <strong>{{editorFrm.errors['error']}}</strong>
        </div>
        <div *ngFor="let panel of _layoutDeclare.panels" class="form-row">
          <df-panel [panel]="panel" #dfpanel [form]="editorFrm" (valueChanged)="onValueChanged($event)">
          </df-panel>
          <div style="clear:both"></div>
        </div>

        <div style="clear:both"></div>

      </div>
      <!-- /.box-body -->
      <div class="box-footer">
        <div class="form-row" style="border:1px solid #ddd;">

          <div id="cssmenu">
            <ul>
              <li class="active">
                <a href="#tab1" data-toggle="tab" (click)="onTabClick(grid)">
                  Xây tô ốp lát
                </a>
              </li>
              <li>
                <a href="#tab6" data-toggle="tab" (click)="onTabClick(grid5)">
                  Sơn nước
                </a>
              </li>
              <li>
                <a href="#tab7" data-toggle="tab" (click)="onTabClick(grid6)">
                  Trần, vách
                </a>
              </li>
              <li>
                <a href="#tab8" data-toggle="tab" (click)="onTabClick(grid7)">
                  Đá ốp lát
                </a>
              </li>
              <li>
                <a href="#tab9" data-toggle="tab" (click)="onTabClick(grid8)">
                  Epoxy, Khác
                </a>
              </li>
              <li>
                <a href="#tab5" data-toggle="tab" (click)="onTabClick(grid4)">
                  Liên kết đối tác
                </a>
              </li>
              <li>
                <a href="#tab2" data-toggle="tab" (click)="onTabClick(grid1)">
                  WorkFlow
                </a>
              </li>
              <li>
                <a href="#tab3" data-toggle="tab" (click)="onTabClick(grid2)">
                  Bước duyệt
                </a>
              </li>
              <li>
                <a href="#tab4" data-toggle="tab" (click)="onTabClick(grid3)">
                  Đính kèm
                </a>
              </li>
            </ul>
          </div>
          <div class="tab-content">
            <div class="tab-pane active" id="tab1">
              <section id="new">
                <wj-flex-grid class="grid" #grid [ngStyle]="setHeightGrid()">
                  <template wjFlexGridCellTemplate [cellType]="'RowHeader'" let-cell="cell">
                    {{cell.row.index + 1}}
                  </template>
                </wj-flex-grid>
              </section>
            </div>
            <div class="tab-pane" id="tab6">
              <section id="new">
                <wj-flex-grid class="grid5" #grid5 [ngStyle]="setHeightGrid()">
                  <template wjFlexGridCellTemplate [cellType]="'RowHeader'" let-cell="cell">
                    {{cell.row.index + 1}}
                  </template>
                </wj-flex-grid>
              </section>
            </div>
            <div class="tab-pane" id="tab7">
              <section id="new">
                <wj-flex-grid class="grid6" #grid6 [ngStyle]="setHeightGrid()">
                  <template wjFlexGridCellTemplate [cellType]="'RowHeader'" let-cell="cell">
                    {{cell.row.index + 1}}
                  </template>
                </wj-flex-grid>
              </section>
            </div>
            <div class="tab-pane" id="tab8">
              <section id="new">
                <wj-flex-grid class="grid7" #grid7 [ngStyle]="setHeightGrid()">
                  <template wjFlexGridCellTemplate [cellType]="'RowHeader'" let-cell="cell">
                    {{cell.row.index + 1}}
                  </template>
                </wj-flex-grid>
              </section>
            </div>
            <div class="tab-pane" id="tab9">
              <section id="new">
                <wj-flex-grid class="grid8" #grid8 [ngStyle]="setHeightGrid()">
                  <template wjFlexGridCellTemplate [cellType]="'RowHeader'" let-cell="cell">
                    {{cell.row.index + 1}}
                  </template>
                </wj-flex-grid>
              </section>
            </div>
            <div class="tab-pane" id="tab2">
              <section id="new">
                <wj-flex-grid class="grid1" #grid1 [ngStyle]="setHeightGrid()">
                  <template wjFlexGridCellTemplate [cellType]="'RowHeader'" let-cell="cell">
                    {{cell.row.index + 1}}
                  </template>
                </wj-flex-grid>
              </section>
            </div>
            <div class="tab-pane" id="tab3">
              <section id="new">
                <wj-flex-grid class="grid2" #grid2 [ngStyle]="setHeightGrid()">
                  <template wjFlexGridCellTemplate [cellType]="'RowHeader'" let-cell="cell">
                    <label>{{cell.row.index + 1}}</label>
                  </template>
                  <template wjFlexGridCellTemplate [cellType]="'TopLeft'" let-cell="cell">
                    <!-- <button class="btn fa fa-trash" (click)=deleteSelectedRows(grid2)></button> -->
                  </template>
                </wj-flex-grid>
              </section>
            </div>
            <div class="tab-pane" id="tab4">
              <section id="new">
                <wj-flex-grid class="grid3" #grid3 [ngStyle]="setHeightGrid()">
                  <template wjFlexGridCellTemplate [cellType]="'RowHeader'" let-cell="cell">
                    {{cell.row.index + 1}}
                  </template>
                </wj-flex-grid>
              </section>
            </div>
            <div class="tab-pane" id="tab5">
              <section id="new">
                <wj-flex-grid class="grid4" #grid4 [ngStyle]="setHeightGrid()">
                  <template wjFlexGridCellTemplate [cellType]="'RowHeader'" let-cell="cell">
                    <label>{{cell.row.index + 1}}</label>
                  </template>
                  <template wjFlexGridCellTemplate [cellType]="'TopLeft'" let-cell="cell">
                    <!-- <button class="btn fa fa-trash" (click)=deleteSelectedRows(grid4)></button> -->
                  </template>
                </wj-flex-grid>
              </section>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
  <!-- /.box -->
</section>
<!-- /.content -->
<!--Loading-->
<div *ngIf="showLoading" class="bravo-wait">
  <img src="/assets/img/gears.svg" style="width:50%">
  <div style="font-size: 15px; padding-left: 12px;color: #fff;">Loading ....</div>
</div>

<div *ngIf="showLoading" class="bravo-wrapper" style="height: 100%; width: 100%;"></div>
<!--/.Loading-->

<wj-popup #frmPopupTooltip hideTrigger="None" style="width: 40%;height: 400px;">
  <div class="box" style="height: 400px;overflow-y: auto;">
    <div class="box-header with-border"
      style="background:linear-gradient(to right,#0288D1,#a8dac3); position: fixed; width: 40%;">
      <h3 class="box-title" style="color: white;">Ý kiến</h3>
      <div class="box-tools pull-right">
        <button type="button" style="color:red;font-size:18px;" class="btn btn-box-tool"
          (click)="frmPopupTooltip.hide()" data-toggle="tooltip">
          <i class="fa fa-times"></i>
        </button>
      </div>
    </div>
    <div class="box-body" style="margin-top: 35px;">
      <p #contentPopupTooltip></p>
    </div>
  </div>
</wj-popup>
