<div class="content-wrapper">
        <div *ngIf="isUsingFilter" class="col-md-2 filter">
        <section class="content">
            <div class="box" id="box-content">
                <div class="box-header with-border">
                    <h3 class="box-title">Điều kiện lọc</h3>
                    <div class="box-tools pull-right">
                        <!--button type="button" class="btn btn-box-tool">
                            <i class="fa fa-list" aria-hidden="true"></i>
                        </button-->

                        <a class="dropdown-toggle btn" data-toggle="dropdown" href="#">
                                                <i class="fa fa-list" aria-hidden="true"></i>
                                            </a>
                        <ul class="dropdown-menu">
                            <li *ngFor="let item of filterData">
                                <div class="checkbox">
                                    <label>
                                        <input type="checkbox"
                                            (click)="updateCheckedOptions($event, item)"
                                            [ngModel]="item.isChecked"/>
                                        {{item.label}}
                                    </label>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
                <form (ngSubmit)="onSubmit(form)" [formGroup]="form">
                    <div class="box-body" [style.height.px]="contentFilterHeight">
                        <div *ngFor="let input of inputs" class="form-row">
                            <df-input [input]="input" [form]="form" (toogle)="tooglePin($event)"></df-input>
                        </div>
                    </div>

                    <div class="box-footer">
                        <button class="btn btn-primary">Chạy báo cáo</button>
                        <button (click)="toogleFilter()" class="btn btn-danger">Hủy</button>
                    </div>
                </form>
            </div>
        </section>
    </div>
    <div [ngClass]="{'col-md-10 content-filter': isUsingFilter}">
        <section class="content">
            <div class="box" id="box-content">
                <div class="box-header with-border">
                    <h3 class="box-title" id="titleName">{{text}}</h3>
                    <button type="button" class="btn btn-box-tool btn-filter" data-toggle="tooltip" title="Lọc dữ liệu" (click)="toogleFilter()"> 
                                            <i class="fa fa-filter fa-lg" aria-hidden="true"></i>
                                        </button>

                    <div class="box-tools pull-right">
                        <button type="button" class="btn btn-box-tool" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                                                <i class="fa fa-minus"></i>
                                            </button>
                        <button type="button" class="btn btn-box-tool" data-widget="remove" data-toggle="tooltip" title="Remove">
                                                <i class="fa fa-times"></i>
                                            </button>
                    </div>
                </div>
                <div class="box-body" #contentFilter>
                    <wj-flex-grid [itemsSource]="data" #grid (itemsSourceChanged)="itemsSourceChangedHandler()" style="height:650px;">
                        <template wjFlexGridCellTemplate [cellType]="'TopLeft'">
                            <input type="checkbox" value="">
                        </template>
                        <template wjFlexGridCellTemplate [cellType]="'RowHeader'" let-cell="cell">
                            <input type="checkbox" value="">
                        </template>
                    </wj-flex-grid>
                </div>
            </div>
        </section>
    </div>

    <div *ngIf="!bIsRunReport" class="col-md-12">
        Loading...
    </div>

    <div style="clear:both;"></div>
</div>
