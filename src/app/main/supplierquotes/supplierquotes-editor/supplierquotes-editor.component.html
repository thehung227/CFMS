<!-- Main content -->
<section class="content">
  <!-- Default box -->
  <form (ngSubmit)="onSubmit(editorFrm)" [formGroup]="editorFrm" (keydown)="handleKeyDown($event)">
    <div class="box" id="box-content">
      <div class="box-header with-border">
        <h3 class="box-title" id="titleName">Báo giá nhà cung cấp</h3>
        <div class="box-tools pull-right">
        <!-- <button type="button" class="btn btn-box-tool" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                      <i class="fa fa-minus"></i>
        </button>
        <button type="button" class="btn btn-box-tool" data-widget="remove" data-toggle="tooltip" title="Remove" style="display:none;">
            <i class="fa fa-times"></i>
        </button> -->
          <button class="btn btn-warning" type="button" [disabled]="!editorFrm.valid" (click)="exportExcel(layoutPrint.ExcelName,layoutPrint.FileName, layoutPrint.FolderPath)">Kết xuất</button>         
          <button class="btn btn-primary" type="button" (click)= "sendMailQoutesInvite()" [disabled]="!editorFrm.valid || parentData?.Id == -1 || parentData?.BizDocId_PP == ''" *ngIf="isSysAdmin=='true' || isPermisionEdiAll_isSave">Mời báo giá</button>          
          <button class="btn btn-success" type="submit" [disabled]="!editorFrm.valid" *ngIf="isSysAdmin=='true' || isPermisionEdiAll_isSave">Lưu</button>
          <a class="btn btn-default" (click)="closeWindow()">Thoát</a>
          <!-- [routerLink]="['/main','supplierquotes','index']" -->
        </div>
      </div>
      <div class="box-body">
        <div *ngIf="editorFrm.errors" class="alert alert-danger">
          <strong>{{editorFrm.errors['error']}}</strong>
        </div>

        <div *ngFor="let panel of _layoutDeclare.panels" class="form-row" [ngStyle]="setDisplayPanel()">
          <df-panel [panel]="panel" #dfpanel [form]="editorFrm" (valueChanged)="onValueChanged($event)">
          </df-panel>
          <div style="clear:both"></div>
        </div>

        <div style="clear:both"></div>

      </div>
      <!-- /.box-body -->
      <div class="box-footer">

        <button class="btn btn-info fa fa-refresh" type="button" [disabled]="!editorFrm.valid" style="margin-bottom:10px;" (click)=onClick()>
          <span style="font-size:11pt;font-family:Arial, Helvetica, sans-serif">Tải dữ liệu</span>
        </button>
        <button title="Ẩn/ Hiện đầu phiếu" class="btn btn-info fa fa-arrows-v" type="button" [disabled]="editorFrm.disabled" style="margin-bottom:10px;"
          (click)=onclickCollapsablePanel([grid,grid1])>
          <span style="font-size:12pt;"></span>
        </button>

        <div class="upload-btn-wrapper" style="position:relative;top: 6px;">
          <button class="btn btn-info" type="button" id="importBtn" [disabled]="!editorFrm.valid" (click)="openDialog()" style="height: 30px;">Nhập dữ liệu từ excel</button>
          <wj-popup #importPopup hideTrigger="None" style="width: 60%;">
            <div class="box" id="box-content">
              <div class="box-header with-border">
                <h3 class="box-title">Nhập liệu từ excel</h3>
                <div class="box-tools pull-right">
                  <button type="button" style="color:blue;font-size:18px;" class="btn btn-box-tool" (click)="updateImportTo(grid)" data-toggle="tooltip"
                    title="OK">
                    <i class="fa fa-check-square-o"></i>
                  </button>
                  <button type="button" style="color:red;font-size:18px;" class="btn btn-box-tool" (click)="importPopup.hide()" data-toggle="tooltip"
                    title="Đóng">
                    <i class="fa fa-times"></i>
                  </button>

                </div>
                <div>
                  <input type="file" style="display:none" id="importControl" [disabled]="!editorFrm.valid" (change)="importExcel()" />
                  <wj-input-number #importNumber data-toggle="tooltip" title="Start Row" place-holder="Start Row" [value]='2'>
                  </wj-input-number>
                </div>
              </div>
              <div class="box-body">
                <wj-flex-grid class="grid" #importGrid>
                  <template wjFlexGridCellTemplate [cellType]="'RowHeader'" let-cell="cell">
                    {{cell.row.index + 1}}
                  </template>
                  <template wjFlexGridCellTemplate [cellType]="'TopLeft'" let-cell="cell">
                    <button type="button" class="btn" style="margin:auto;width:100%;" (click)="deleteImportRow()">
                      <a class="fa fa-trash-o" style="color:red;"></a>
                    </button>
                  </template>
                </wj-flex-grid>
              </div>
            </div>
          </wj-popup>
        </div>

        <div class="form-row" style="border:1px solid #ddd;">

          <!-- <div class="nav-tabs-custom">
            <ul class="nav nav-tabs">
              <li class="active">
                <a href="#tab1" data-toggle="tab" style="background-color:#ffe3e3;">
                  <b>Chi tiết</b>
                </a>
              </li>
            </ul>
          </div> -->
          <div id="cssmenu">
            <ul>
              <li class="active">
                <a href="#tab1" data-toggle="tab">
                  Chi tiết mặt hàng
                </a>
              </li>
            </ul>
          </div>
          <div class="tab-content">
            <div class="tab-pane active" id="tab1">
              <section id="new">
                <wj-flex-grid class="grid" #grid style="height:280px;" [ngStyle]="setHeightGrid()" (draggedRow)="resetBuiltinOrder(grid)" (rowAdded)="rowAddedEvent(grid)">
                  <template wjFlexGridCellTemplate [cellType]="'RowHeader'" let-cell="cell">
                    {{cell.row.index + 1}}
                  </template>
                  <template wjFlexGridCellTemplate [cellType]="'TopLeft'" let-cell="cell">
                    <button type="button" class="btn" style="margin:auto;width:100%;background-color:aliceblue;" (click)=deleteSelectedRows(grid)>
                      <a class="fa fa-trash-o" style="color:red;"></a>
                    </button>
                  </template>
                </wj-flex-grid>
                <!-- lưới hỗ trợ in detail -->
                <wj-flex-grid [itemsSource]="dataPrint" #gridPrint style="height:650px;display:none;">
                </wj-flex-grid>
              </section>
            </div>
          </div>

        </div>
      </div>

      <!-- /.box-footer-->
    </div>
  </form>
  <!-- /.box -->
</section>
<!-- /.content -->

<wj-popup #frmEmailPopup hideTrigger="None" style="width: 60%;height: 80%;">
  <div class="panel panel-primary" style="margin-top: 0px;margin-bottom: 0px;">
    <div class="panel-heading">
      <h3 class="panel-title">Soạn thư</h3>
    </div>
    <div class="panel-body" style="padding: 15px;">
      <form>
        <div class="form-group">
          <label class="control-label">Gửi đến</label>
          <input type="text" class="form-control" #inputTo placeholder="Email nhận">
        </div>
        <div class="form-group">
          <label class="control-label">CC</label>
          <input type="text" class="form-control" #inputCC placeholder="CC to: ngăn cách bằng dấu ;">
        </div>
        <!-- <div class="form-group">
          <label class="control-label">BCC</label>
          <input type="text" class="form-control" #inputBCC placeholder="BCC to: ngăn cách bằng dấu ;">
        </div> -->
        <div class="form-group">
          <label class="control-label">Tiêu đề</label>
          <input type="text" class="form-control" #inputSubject placeholder="Tiêu đề">
        </div>
        <div class="form-group">
          <label class="control-label">Nội dung</label>
          <textarea [id]="'richtextmail'"></textarea>
        </div>
        <div class="form-group">
          <button type="button" class="btn btn-raised btn-primary" (click)="sendMailCustom(false)">Gửi</button>
          <button type="button" class="btn btn-raised btn-danger" (click)="closeFormEmail()">Hủy</button>
        </div>
      </form>
    </div>
  </div>
</wj-popup>

<!--Loading-->
<div *ngIf="showLoading" class="bravo-wait">
  <img src="/assets/img/gears.svg" style="width:50%">
  <div style="font-size: 15px; padding-left: 12px;color: #fff;">Loading ....</div>
</div>

<div *ngIf="showLoading" class="bravo-wrapper" style="height: 100%; width: 100%;"></div>
<!--/.Loading-->
