    </div>
    <div class="panel-body">
      <form>

            style="width:40rem;">
        </div>
        <div class="form-group">

        </div>

        </div> -->
        <div class="form-group">
          <label class="control-label">Subject</label>
          <input type="text" class="form-control" #inputSubject [placeholder]="isLangVN ? 'Tiêu đề' : 'Subject'">
        </div>

          <textarea [id]="'richtextmail'"
            [placeholder]="isLangVN ? 'Gõ nội dung tại đây' : 'Type content here'"></textarea>

        <div class="form-group">
          <button type="button" class="btn btn-raised btn-primary" (click)="SendMail()"

          <button type="button" class="btn btn-raised btn-danger" (click)="closeForm()"
