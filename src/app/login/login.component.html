<div class="login-box" [style.display]="useSSO ? 'none' : 'block'">
    <div class="login-logo">
        <a href="#">Newtecons Group</a>
    </div>
    <!-- /.login-logo -->
    <div class="login-box-body" style="background: #667fa7; border-radius: 5px;display: none;">
        <!--p class="login-box-msg">Sign in to start your session</p-->

        <form (ngSubmit)="loginForm.form.valid && login()" method="post" #loginForm="ngForm">
            <div class="form-group has-feedback">
                    <input type="email" class="form-control" name="username" required [(ngModel)]="model.username" #username placeholder="Email">

                    <span class="glyphicon glyphicon-user form-control-feedback"></span>
                <!-- <div class="userBox">
                        
                </div>
                <div class="suffixBox">
                        <wj-combo-box style="height: 34px;" [itemsSource]="suffixEmail" [displayMemberPath]="'htmlDisplay'" [selectedValuePath]="'value'" [isContentHtml]="true"
                        [isEditable]="false" [(ngModel)]="model.suffixmail" name="suffixmail">
                    </wj-combo-box>
                </div> -->
                
            </div>
            <div class="form-group has-feedback">
                <input type="password" class="form-control" name="password" required [(ngModel)]="model.password" #password="ngModel" placeholder="Password" (keypress)="capLock($event)">
                <span class="glyphicon glyphicon-lock form-control-feedback"></span>
            </div>
            <div class="form-group has-feedback">
                <wj-combo-box #cmb2 [itemsSource]="branchs" [displayMemberPath]="'htmlDisplay'" [selectedValuePath]="'value'" [isContentHtml]="true"
                    [isEditable]="false" [(ngModel)]="model.branchcode" name="branchcode">
                </wj-combo-box>
            </div>
            
            <div class="row">
                <div class="col-xs-8">
                    <div id="warningLogin" [ngStyle]="{ 'color': textWarningLogin != '' ? 'yellow' : 'white', 'display': textWarningLogin != '' ? 'inline-block' : 'none' }" >{{textWarningLogin}}</div>
                    <!-- <div class="checkbox icheck">
                        <label>
                            <input type="checkbox"> Remember Me
                        </label>
                    </div> -->
                </div>
                <!-- /.col -->
                <div class="col-xs-4">
                    <button type="submit" class="btn btn-primary btn-block btn-flat" [disabled]="!loginForm.form.valid">Đăng nhập</button>
                    <img *ngIf="loading" src="data:image/gif;base64,R0lGODlhEAAQAPIAAP///wAAAMLCwkJCQgAAAGJiYoKCgpKSkiH/C05FVFNDQVBFMi4wAwEAAAAh/hpDcmVhdGVkIHdpdGggYWpheGxvYWQuaW5mbwAh+QQJCgAAACwAAAAAEAAQAAADMwi63P4wyklrE2MIOggZnAdOmGYJRbExwroUmcG2LmDEwnHQLVsYOd2mBzkYDAdKa+dIAAAh+QQJCgAAACwAAAAAEAAQAAADNAi63P5OjCEgG4QMu7DmikRxQlFUYDEZIGBMRVsaqHwctXXf7WEYB4Ag1xjihkMZsiUkKhIAIfkECQoAAAAsAAAAABAAEAAAAzYIujIjK8pByJDMlFYvBoVjHA70GU7xSUJhmKtwHPAKzLO9HMaoKwJZ7Rf8AYPDDzKpZBqfvwQAIfkECQoAAAAsAAAAABAAEAAAAzMIumIlK8oyhpHsnFZfhYumCYUhDAQxRIdhHBGqRoKw0R8DYlJd8z0fMDgsGo/IpHI5TAAAIfkECQoAAAAsAAAAABAAEAAAAzIIunInK0rnZBTwGPNMgQwmdsNgXGJUlIWEuR5oWUIpz8pAEAMe6TwfwyYsGo/IpFKSAAAh+QQJCgAAACwAAAAAEAAQAAADMwi6IMKQORfjdOe82p4wGccc4CEuQradylesojEMBgsUc2G7sDX3lQGBMLAJibufbSlKAAAh+QQJCgAAACwAAAAAEAAQAAADMgi63P7wCRHZnFVdmgHu2nFwlWCI3WGc3TSWhUFGxTAUkGCbtgENBMJAEJsxgMLWzpEAACH5BAkKAAAALAAAAAAQABAAAAMyCLrc/jDKSatlQtScKdceCAjDII7HcQ4EMTCpyrCuUBjCYRgHVtqlAiB1YhiCnlsRkAAAOwAAAAAAAAAAAA=="

        </form>

    </div>
    <!-- /.login-box-body -->
</div>
